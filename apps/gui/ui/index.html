<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NetTool Dashboard</title>
    <style>
        :root { color-scheme:dark; --bg:#0f172a; --panel:#172033; --line:#34445e; --accent:#74c9f0; --muted:#b0bfd3; --text:#e5eefc; }
        * { box-sizing:border-box; }
        body { margin:0; font:15px/1.65 "Segoe UI","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); }
        .layout { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:100vh; }
        nav { padding:28px 16px; border-right:1px solid var(--line); background:#111b2e; }
        nav h1 { margin:0; font-size:25px; } nav p { margin:4px 0 24px; color:var(--muted); font-size:13px; }
        button,input,select,textarea { font:inherit; } button { cursor:pointer; min-height:42px; }
        nav button { display:block; width:100%; margin:5px 0; padding:10px 14px; border:0; border-left:3px solid transparent; text-align:left; color:var(--muted); background:transparent; }
        nav button:hover,nav button[aria-current="page"] { background:#20304b; color:var(--text); border-left-color:var(--accent); }
        main { padding:30px; max-width:1440px; width:100%; min-width:0; }
        .toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
        h2 { margin:0; font-size:27px; } h3 { margin:0 0 12px; font-size:18px; } p { max-width:78ch; }
        .hint { color:var(--muted); } .intro { margin:4px 0 0; }
        .card { padding:22px; margin:0 0 18px; border:1px solid var(--line); border-radius:10px; background:var(--panel); min-width:0; }
        .grid,.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:16px; }
        .split { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr); gap:18px; }
        label { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; color:var(--muted); }
        input,select,textarea { padding:9px 11px; color:var(--text); background:#0a1020; border:1px solid var(--line); border-radius:6px; width:100%; min-width:0; }
        textarea { min-height:150px; resize:vertical; font:13px/1.6 Consolas,monospace; }
        .check { flex-direction:row; align-items:flex-start; gap:10px; } .check input { width:auto; margin-top:7px; }
        .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
        .primary,.secondary { padding:9px 16px; border-radius:6px; border:1px solid var(--line); }
        .primary { color:#071525; background:var(--accent); border-color:var(--accent); font-weight:600; }
        .secondary { color:var(--text); background:#20304b; } button:disabled { cursor:wait; opacity:.6; }
        :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
        pre { padding:16px; overflow:auto; max-height:420px; border-radius:6px; background:#0a1020; color:#c5d5eb; font:13px/1.6 Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
        details { margin-top:16px; } summary { cursor:pointer; color:var(--accent); padding:5px 0; }
        .status { overflow-wrap:anywhere; } .error { color:#ffb3b3; } .success { color:#b4e3ce; }
        .notice { border-left:4px solid #f5ce86; } .notice h3 { color:#f5ce86; }
        .table-wrap { width:100%; overflow:auto; } table { width:100%; border-collapse:collapse; text-align:left; font-size:14px; }
        caption { text-align:left; color:var(--muted); padding-bottom:10px; } th { color:var(--muted); font-weight:600; white-space:nowrap; }
        td,th { padding:12px; border-bottom:1px solid var(--line); vertical-align:top; } td { overflow-wrap:anywhere; }
        .profile-list { display:grid; gap:8px; } .profile-item { text-align:left; width:100%; } .profile-item span { display:block; font-size:12px; color:var(--muted); }
        .metric { font-size:30px; font-weight:600; color:var(--accent); }
        [hidden] { display:none !important; } .skip { position:absolute; left:16px; top:-80px; background:var(--panel); padding:12px; color:var(--accent); z-index:1; } .skip:focus { top:12px; }
        @media(max-width:780px) { .layout { grid-template-columns:1fr; } nav { display:flex; gap:5px; overflow:auto; padding:10px; border-right:0; border-bottom:1px solid var(--line); } nav h1,nav p { display:none; } nav button { width:auto; white-space:nowrap; } main { padding:18px; } .split { grid-template-columns:1fr; } .toolbar { align-items:flex-start; } }
    </style>
    <script src="/app.js" defer></script>
</head>
<body>
    <a class="skip" href="#main">跳至主要內容</a>
    <div class="layout">
        <nav aria-label="功能導覽">
            <h1>NetTool</h1><p>網路工程工具箱</p>
            <button data-page="dashboard" aria-current="page">功能總覽</button>
            <button data-page="interfaces">網路介面</button>
            <button data-page="profiles">網路設定 Profile</button>
            <button data-page="hosts">Hosts</button>
            <button data-page="speed">網路測速</button>
            <button data-page="packets">封包分析</button>
            <button data-page="nodes">Node 配對</button>
            <button data-page="settings">環境與能力</button>
            <button data-page="history">測速歷史</button>
            <button data-page="help">使用說明</button>
        </nav>
        <main id="main" tabindex="-1">
            <header class="toolbar"><div><h2 id="page">功能總覽</h2><p id="page-hint" class="hint intro"></p></div><button class="secondary" id="refresh" type="button">重新整理</button></header>
            <section id="safe-apply" class="card notice" hidden aria-labelledby="safe-title">
                <h3 id="safe-title">Safe Apply 確認／回復</h3>
                <p class="hint">套用後請先檢查網路連線，再於 Helper 期限內確認；未確認會由 Helper 嘗試自動回復。重新載入頁面後，可貼上先前結果中的 operation_id。</p>
                <label>操作識別碼（operation_id）<input id="operation-id" autocomplete="off"></label>
                <div class="actions"><button id="profile-confirm" class="primary" type="button">確認保留設定</button><button id="profile-rollback" class="secondary" type="button">回復原設定</button></div>
                <p id="safe-status" class="status" role="status" aria-live="polite"></p>
            </section>
            <section id="content" aria-label="目前功能"></section>
            <details class="card" id="console">
                <summary>進階 Action Console</summary>
                <p class="hint">僅執行已註冊的 Action。請依 CLI Reference 提供完整 JSON；變更操作會立即送出，請先核對內容。</p>
                <label>操作<select id="action-select"></select></label><p class="hint" id="action-scope"></p>
                <label>JSON 參數<textarea id="action-payload" spellcheck="false">{}</textarea></label>
                <button class="primary" id="run-action" type="button">執行 Action</button>
                <pre id="action-result" role="status" aria-live="polite">尚未執行。</pre>
            </details>
            <noscript><p class="error">此介面需要啟用 JavaScript。</p></noscript>
        </main>
    </div>
</body>
</html>
