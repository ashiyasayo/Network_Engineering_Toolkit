<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetTool Dashboard</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --panel:#172033; --line:#2b3a55; --accent:#38bdf8; --muted:#9fb0c8; }
    * { box-sizing:border-box; } body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:#e5eefc; }
    .layout { display:grid; grid-template-columns:220px 1fr; min-height:100vh; } nav { padding:22px 14px; border-right:1px solid var(--line); background:#111b2e; }
    h1 { margin:0 0 22px; font-size:20px; color:var(--accent); } nav button { display:block; width:100%; margin:4px 0; padding:10px; border:0; border-radius:8px; text-align:left; color:#c9d7eb; background:transparent; cursor:pointer; } nav button:hover, nav button.active { background:#20304b; color:white; }
    main { padding:28px; max-width:1200px; width:100%; margin:auto; } .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:22px; } .toolbar h2 { flex:1; margin:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; } .card { padding:18px; border:1px solid var(--line); border-radius:12px; background:var(--panel); } .card h3 { margin:0 0 10px; font-size:14px; color:var(--muted); } .value { font-size:24px; font-weight:650; } .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; } .form-grid label { display:flex; flex-direction:column; gap:5px; color:var(--muted); } .form-grid input { padding:8px; border:1px solid var(--line); border-radius:6px; color:#e5eefc; background:#0a1020; }
    button.primary { border:0; border-radius:7px; padding:9px 14px; color:#06111c; background:var(--accent); cursor:pointer; } pre { max-height:420px; overflow:auto; padding:14px; border-radius:10px; background:#0a1020; color:#b8c8df; } .hint { color:var(--muted); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:3px solid #7dd3fc; outline-offset:2px; } button:disabled { cursor:wait; opacity:.65; } .profile-layout { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr); gap:14px; } .profile-list { display:grid; gap:8px; } .profile-item { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; text-align:left; color:#e5eefc; background:#0a1020; cursor:pointer; } .profile-item:hover { border-color:var(--accent); background:#13223a; } .profile-item strong, .profile-item span { display:block; } .profile-item span, .status { margin-top:3px; color:var(--muted); font-size:12px; } .profile-detail { min-height:140px; } textarea { min-height:150px; padding:10px; border:1px solid var(--line); border-radius:6px; color:#e5eefc; background:#0a1020; font:12px ui-monospace,SFMono-Regular,Consolas,monospace; resize:vertical; } .profile-form { display:grid; gap:12px; } .form-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .secondary { border:1px solid var(--line); border-radius:7px; min-height:40px; padding:9px 14px; color:#e5eefc; background:#20304b; cursor:pointer; } @media(max-width:720px){ .layout{grid-template-columns:1fr;} nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:4px;} nav h1{display:none;} nav button{width:auto;white-space:nowrap;} main{padding:18px;} .profile-layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="layout">
    <nav><h1>NetTool</h1><button class="active" data-page="Dashboard">Dashboard</button><button data-page="Network Interfaces">Network Interfaces</button><button data-page="Profiles">Profiles</button><button data-page="Hosts">Hosts</button><button data-page="Speed Test">Speed Test</button><button data-page="Packet Analysis">Packet Analysis</button><button data-page="Node">Node</button><button data-page="Settings">Settings</button><button data-page="Logs">Logs</button></nav>
    <main><div class="toolbar"><h2 id="page">Dashboard</h2><button class="primary" id="refresh">Refresh</button></div><section id="content"></section><section class="card" style="margin-top:18px"><h3>Action Console</h3><p class="hint">僅能執行 ActionRegistry 內的 action；GUI 不接受 shell 或任意命令。</p><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="action-select" style="flex:1;min-width:220px;padding:8px;background:#0a1020;color:#e5eefc;border:1px solid var(--line);border-radius:6px"></select><button class="primary" id="run-action">Execute</button></div><p class="hint" id="action-scope">載入 action 分類中…</p><textarea id="action-payload" rows="3" style="width:100%;margin-top:10px;padding:10px;background:#0a1020;color:#b8c8df;border:1px solid var(--line);border-radius:6px" spellcheck="false">{}</textarea><pre id="action-result" style="max-height:180px">尚未執行 action。</pre></section></main>
  </div>
  <script>
    const content = document.querySelector('#content'), page = document.querySelector('#page'), actionMetadata = new Map(); let selectedProfileId='';
    const payloads = { 'Dashboard':['system.health',{}], 'Network Interfaces':['interface.list',{}], Profiles:['profile.list',{}], Hosts:['hosts.read',{}], 'Speed Test':['speed.history',{limit:20}], 'Packet Analysis':['packet.connections',{}], 'Node':['node.status',{}], Settings:['dataplane.probe',{}], Logs:['speed.history',{limit:20}] };
    async function call(action,payload){ const r=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,payload})}); return r.json(); }
    function renderActionScope(){ const item=actionMetadata.get(document.querySelector('#action-select').value), scope=document.querySelector('#action-scope'); scope.textContent=item?.server_only?'【伺服器專用】需要長時間測試或高速 NIC、NUMA、Huge Page、native backend；一般筆電可查詢，但不適合作為效能驗收。':'一般裝置可用；實際可用能力仍依作業系統、權限與硬體而定。'; }
    async function loadActions(){ const actions=await (await fetch('/api/actions')).json(); const select=document.querySelector('#action-select'); actions.forEach(item=>{ actionMetadata.set(item.name,item); const option=document.createElement('option'); option.value=item.name; option.textContent=(item.server_only?'【伺服器專用】 ':'')+item.name+' — '+item.cli; select.appendChild(option); }); renderActionScope(); }
    async function render(name){ page.textContent=name; if(name==='Profiles'){ renderProfilesPage(); return; } if(name==='Node'){ renderNodePage(); return; } const entry=payloads[name]; if(!entry){ content.innerHTML='<div class="card"><h3>'+name+'</h3><p class="hint">此頁面使用同一套 Agent Action API；請從 CLI 或對應頁面執行詳細操作。</p><pre>'+JSON.stringify({status:'ready',action_registry:'/api/actions'},null,2)+'</pre></div>'; return; } content.innerHTML='<div class="card"><h3>'+entry[0]+'</h3><p class="hint">Loading…</p></div>'; try { const result=await call(...entry); content.innerHTML='<div class="grid"><div class="card"><h3>Agent result</h3><div class="value">'+(result.success?'Ready':'Error')+'</div></div></div><pre>'+JSON.stringify(result,null,2)+'</pre>'; } catch (error) { content.innerHTML='<div class="card"><h3>Agent unavailable</h3><p class="hint">'+String(error)+'</p></div>'; } }
    const defaultProfileConfiguration = JSON.stringify({ipv4:{mode:'dhcp'},ipv6:{mode:'automatic'},dns:{automatic:true,servers:[],search_domains:[]},routes:[],mtu:null},null,2);
    function renderProfilesPage(){ selectedProfileId=''; content.innerHTML='<div class="profile-layout"><section class="card"><div class="toolbar" style="margin-bottom:12px"><h3>Saved profiles</h3><button class="secondary" id="profile-reload" type="button">Reload</button></div><p class="hint">選取 profile 可讀取目前保存的完整設定。</p><div id="profile-list" class="profile-list" aria-live="polite"></div></section><section class="card"><h3 id="profile-detail-title">Profile details</h3><p class="hint">套用會使用 Safe Apply；一般免安裝版會明確要求安裝 Helper。</p><pre id="profile-detail" class="profile-detail">請從左側選取 profile。</pre><div class="form-actions"><label for="profile-interface" class="hint">Interface ID<input id="profile-interface" autocomplete="off" placeholder="Ethernet"></label><label for="profile-timeout" class="hint">Confirm seconds<input id="profile-timeout" type="number" min="10" max="600" value="60"></label><button class="primary" id="profile-apply" type="button" disabled>Apply profile</button></div><p id="profile-apply-status" class="status" role="status" aria-live="polite"></p></section></div><section class="card" style="margin-top:14px"><h3>Create profile</h3><p class="hint">設定會由 Agent 驗證並保存為 revision 1。請使用完整 IPv4、IPv6、DNS、routes、MTU schema。</p><form id="profile-create-form" class="profile-form"><div class="form-grid"><label for="profile-id">Profile ID<input id="profile-id" name="id" autocomplete="off" required maxlength="64" aria-describedby="profile-id-help"></label><label for="profile-name">Display name<input id="profile-name" name="name" autocomplete="off" required maxlength="128"></label></div><p id="profile-id-help" class="hint">使用穩定、好辨識的 ID，例如 office 或 lab-dhcp。</p><label for="profile-configuration">Network configuration JSON<textarea id="profile-configuration" name="configuration" spellcheck="false" required aria-describedby="profile-configuration-help"></textarea></label><p id="profile-configuration-help" class="hint">可從 DHCP 範本開始，或改成 static addresses、DNS 與 routes。</p><div class="form-actions"><button class="primary" id="profile-create-submit" type="submit">Create profile</button><span id="profile-create-status" class="status" role="status" aria-live="polite"></span></div><pre id="profile-create-result" hidden></pre></form></section>'; document.querySelector('#profile-configuration').value=defaultProfileConfiguration; document.querySelector('#profile-reload').addEventListener('click',loadProfiles); document.querySelector('#profile-create-form').addEventListener('submit',createProfile); document.querySelector('#profile-apply').addEventListener('click',applySelectedProfile); loadProfiles(); }
    async function loadProfiles(){ const list=document.querySelector('#profile-list'); if(!list) return; list.replaceChildren(); const loading=document.createElement('p'); loading.className='hint'; loading.textContent='Loading profiles…'; list.appendChild(loading); try { const response=await call('profile.list',{}); if(!response.success) throw new Error(response.error?.message||'profile list failed'); const profiles=response.data; if(!Array.isArray(profiles)||profiles.length===0){ loading.textContent='尚未建立 profile。'; return; } list.replaceChildren(); profiles.forEach(summary=>{ const item=document.createElement('button'); item.type='button'; item.className='profile-item'; item.setAttribute('aria-label','Read profile '+String(summary.name||summary.id||'')); const title=document.createElement('strong'); title.textContent=String(summary.name||summary.id||'Unnamed profile'); const meta=document.createElement('span'); meta.textContent='ID: '+String(summary.id||'')+' · revision '+String(summary.active_revision??'?'); item.append(title,meta); item.addEventListener('click',()=>showProfile(String(summary.id))); list.appendChild(item); }); } catch(error){ loading.textContent='Unable to load profiles: '+String(error); } }
    async function showProfile(id){ const title=document.querySelector('#profile-detail-title'), output=document.querySelector('#profile-detail'), apply=document.querySelector('#profile-apply'); if(!title||!output) return; selectedProfileId=id; title.textContent='Profile details — '+id; output.textContent='Loading…'; if(apply) apply.disabled=false; try { const response=await call('profile.show',{id_or_name:id}); output.textContent=JSON.stringify(response,null,2); } catch(error){ output.textContent='Unable to read profile: '+String(error); } }
    async function applySelectedProfile(){ const status=document.querySelector('#profile-apply-status'), button=document.querySelector('#profile-apply'), interfaceId=document.querySelector('#profile-interface').value.trim(), timeout=Number(document.querySelector('#profile-timeout').value); if(!selectedProfileId||!interfaceId){ status.textContent='請先選擇 profile 並填寫 Interface ID。'; return; } if(!Number.isInteger(timeout)||timeout<10||timeout>600){ status.textContent='確認時間必須介於 10 至 600 秒。'; return; } button.disabled=true; try { status.textContent='正在準備 Helper…'; const helper=await (await fetch('/api/portable-helper',{method:'POST'})).json(); if(!helper.success) throw new Error(helper.error?.message||'Helper is required'); status.textContent=helper.mode==='portable-uac'?'已要求 UAC；正在套用 profile…':'正在套用 profile…'; let response; for(let attempt=0;attempt<10;attempt+=1){ response=await call('profile.apply',{id_or_name:selectedProfileId,interface_id:interfaceId,confirm_timeout_seconds:timeout}); if(response.success||!response.error?.retryable) break; await new Promise(resolve=>setTimeout(resolve,250)); } if(!response.success) throw new Error(response.error?.message||'profile apply failed'); status.textContent='Profile 已套用，請在期限內確認或 rollback。'; document.querySelector('#profile-detail').textContent=JSON.stringify(response,null,2); } catch(error){ status.textContent='未套用 profile：'+String(error); } finally { button.disabled=false; } }
    async function createProfile(event){ event.preventDefault(); const form=event.currentTarget, id=form.elements.id.value.trim(), name=form.elements.name.value.trim(), configurationText=form.elements.configuration.value, button=document.querySelector('#profile-create-submit'), status=document.querySelector('#profile-create-status'), output=document.querySelector('#profile-create-result'); output.hidden=false; try { if(!id||!name) throw new Error('Profile ID and display name are required'); const configuration=JSON.parse(configurationText); if(!configuration||Array.isArray(configuration)||typeof configuration!=='object') throw new Error('Network configuration must be a JSON object'); button.disabled=true; status.textContent='Saving profile…'; const response=await call('profile.create',{id,name,configuration}); output.textContent=JSON.stringify(response,null,2); if(!response.success) throw new Error(response.error?.message||'profile create failed'); status.textContent='Profile saved.'; form.reset(); form.elements.configuration.value=defaultProfileConfiguration; await loadProfiles(); await showProfile(id); } catch(error){ status.textContent='Profile was not saved.'; output.textContent=String(error); } finally { button.disabled=false; } }
    function renderNodePage(){ content.innerHTML='<div class="card"><h3>Trusted Node pairing</h3><p class="hint">配對資料會經 Agent 的 typed Action API 保存；certificate 檔案只在瀏覽器記憶體轉成 DER bytes，不會上傳至 GUI server。</p><div class="form-grid"><label>Node ID (32 hex)<input id="pair-node-id" maxlength="32" autocomplete="off"></label><label>Name<input id="pair-name" autocomplete="off"></label><label>Control address<input id="pair-address" placeholder="192.0.2.10:9443" autocomplete="off"></label><label>TLS server name<input id="pair-server" autocomplete="off"></label><label>SPKI fingerprint<input id="pair-fingerprint" autocomplete="off"></label><label>Certificate DER<input id="pair-certificate" type="file" accept=".der,.crt,application/octet-stream"></label></div><label class="hint" style="display:block;margin:12px 0"><input id="pair-fingerprint-confirm" type="checkbox"> I verified this fingerprint through an independent out-of-band channel</label><label class="hint" style="display:block;margin:12px 0"><input id="pair-confirm" type="checkbox"> Confirm identity replacement if an existing Node identity differs</label><button class="primary" id="pair-submit">Pair Node</button><pre id="pair-result" style="max-height:180px">尚未執行配對。</pre></div><div class="card" style="margin-top:14px"><h3>Current trusted Nodes</h3><p class="hint">Loading…</p></div>'; document.querySelector('#pair-submit').addEventListener('click',pairNode); loadNodeStatus(); }
    async function loadNodeStatus(){ const card=content.querySelectorAll('.card')[1]; try { const result=await call('node.status',{}); card.innerHTML='<h3>Current trusted Nodes</h3><pre style="max-height:240px">'+JSON.stringify(result,null,2)+'</pre>'; } catch(error) { card.innerHTML='<h3>Agent unavailable</h3><p class="hint">'+String(error)+'</p>'; } }
    async function pairNode(){ const output=document.querySelector('#pair-result'); try { const file=document.querySelector('#pair-certificate').files[0]; if(!file) throw new Error('certificate DER file is required'); if(!document.querySelector('#pair-fingerprint-confirm').checked) throw new Error('out-of-band fingerprint verification is required'); const bytes=Array.from(new Uint8Array(await file.arrayBuffer())); const payload={node_id:document.querySelector('#pair-node-id').value.trim(),name:document.querySelector('#pair-name').value.trim(),control_address:document.querySelector('#pair-address').value.trim(),server_name:document.querySelector('#pair-server').value.trim(),fingerprint:document.querySelector('#pair-fingerprint').value.trim(),certificate_der:bytes,out_of_band_fingerprint_confirmed:true,identity_change_confirmed:document.querySelector('#pair-confirm').checked}; output.textContent=JSON.stringify(await call('node.pair',payload),null,2); loadNodeStatus(); } catch(error) { output.textContent=String(error); } }
    document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));button.classList.add('active');render(button.dataset.page);})); document.querySelector('#refresh').addEventListener('click',()=>render(page.textContent)); document.querySelector('#action-select').addEventListener('change',renderActionScope); document.querySelector('#run-action').addEventListener('click',async()=>{const output=document.querySelector('#action-result'); try { const payload=JSON.parse(document.querySelector('#action-payload').value); output.textContent=JSON.stringify(await call(document.querySelector('#action-select').value,payload),null,2); } catch(error) { output.textContent=String(error); }}); loadActions(); render('Dashboard');
  </script>
</body>
</html>
