name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Loopback socket integration tests require a Linux runner with local bind permission;
      # other platforms still compile and run the complete non-ignored suite.
      - name: Run Linux loopback integration tests
        if: runner.os == 'Linux'
        run: |
          cargo test -p nettool-agent --bin nettool-agent -- --ignored
          cargo test -p nettool-speed -- --ignored
          cargo test -p nettool-node -- --ignored
      - name: Compile Linux AF_XDP surface
        if: runner.os == 'Linux'
        run: cargo check -p nettool-backend-af-xdp --target x86_64-unknown-linux-gnu
      - name: Exercise Windows RIO boundary
        if: runner.os == 'Windows'
        run: cargo test -p nettool-backend-rio --all-targets

  desktop-packages:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '2.11.4' --locked
      - name: Build release sidecars
        run: cargo build --release -p nettool -p nettool-desktop -p nettool-agent -p nettool-gui -p nettool-dataplane
      - name: Stage Unix Tauri resources
        if: runner.os != 'Windows'
        run: ./packaging/prepare-tauri-resources.sh
      - name: Stage Windows Tauri resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/resources | Out-Null
          foreach ($name in @('nettool.exe','nettool-agent.exe','nettool-gui.exe','nettool-dataplane.exe')) {
            Copy-Item "target/release/$name" "apps/desktop/resources/$name" -Force
          }
      - name: Build desktop package
        run: cd apps/desktop && cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Verify Unix package contents
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          for name in nettool nettool-agent nettool-gui nettool-dataplane; do
            find target/release/bundle -type f -name "$name" -print -quit | grep -q .
          done
          if [ "$RUNNER_OS" = "Linux" ]; then
            test "$(find target/release/bundle -type f -name '*.AppImage' | wc -l)" -ge 1
            test "$(find target/release/bundle -type f -name '*.deb' | wc -l)" -ge 1
          else
            test "$(find target/release/bundle -type f -name '*.dmg' | wc -l)" -ge 1
          fi
      - name: Verify Windows package contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $names = @('nettool.exe','nettool-agent.exe','nettool-gui.exe','nettool-dataplane.exe')
          foreach ($name in $names) {
            if (-not (Get-ChildItem target/release/bundle -Recurse -File -Filter $name)) { throw "missing packaged resource: $name" }
          }
          if (-not (Get-ChildItem target/release/bundle -Recurse -File -Filter *.msi)) { throw 'missing MSI package' }
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: nettool-${{ matrix.os }}-desktop-packages
          path: target/release/bundle/**
          if-no-files-found: error
