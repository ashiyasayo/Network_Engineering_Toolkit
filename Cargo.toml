[workspace]
members = [
    "crates/action",
    "crates/agent-client",
    "crates/agent-protocol",
    "crates/domain",
    "crates/error",
    "crates/helper-core",
    "crates/helper-protocol",
    "crates/helper-server",
    "crates/platform-auth",
    "crates/platform-affinity",
    "crates/identity",
    "crates/node-protocol",
    "crates/packet",
    "crates/node",
    "crates/resource",
    "crates/speed",
    "crates/backend-dpdk",
    "crates/backend-af-xdp",
    "crates/backend-rio",
    "crates/dpdk-safe",
    "crates/dpdk-sys",
    "crates/backend-pcap",
    "crates/benchmark",
    "crates/storage",
    "apps/agent",
    "apps/cli",
    "apps/dataplane",
    "apps/helper",
    "apps/gui",
    "apps/desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
getrandom = "0.4"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
prost = "0.14"
rcgen = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "io-util", "time", "sync", "process"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging"] }
x509-parser = "0.18"
